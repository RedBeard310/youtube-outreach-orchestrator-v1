  <h1>2026-09-02: the biggest parked day in seven weeks, and almost none of it was found today</h1>
  <p class="lede">The ready-to-write pool jumped by <b>177</b>, the largest single-day gain since 07-14. Only <b>48</b> of those leads were found in the last 24 hours. The rest are creators already sitting in the book that the machine walked past a second time and converted. Meanwhile finding itself fell to <b>85</b> good leads from 127, four of the six discovery lanes now have no material left, and for four hours overnight the enrichment step completed nothing at all while reporting success.</p>

  <h2>The shape of the day</h2>
  <div class="card" style="padding:0">
    <div class="strip" id="strip"></div>
    <div class="legend">
      <span><span class="dot" style="background:var(--teal)"></span>good leads found that hour (score ≥ 6)</span>

      <span><span class="dot" style="background:var(--red)"></span>nothing good found that hour</span>
    </div>
  </div>
  <p class="muted">24 hours, 07:00Z to 07:00Z. <b>Every hour produced channels</b>, so nothing stalled, but the day has an obvious shape: the first nine hours found 53 of the 85 good leads, and the remaining fifteen found 32. Two hours in the middle (09:00 and 10:00 PT) found none at all. That is not a fault, it is what happens when the one lane doing most of the work gets deeper into a list it has already read.</p>

  <h2>The three questions</h2>

  <div class="q accent-good">
    <div class="ask"><span class="qn">Q1</span><span>How did the parked pool gain 177 on a day it only found 48?</span></div>
    <p><b>Because the machine spent most of the day re-reading its own book, and re-reading it turned out to pay.</b> On top of the <span class="pill">2,524</span> brand-new channels it wrote, it walked past <span class="pill">3,200</span> channels it already had. That is 56% of the day's channel work spent on ground it had covered before.</p>
    <p>Re-walking is not wasted, and this is the first cycle that shows why. A channel gets looked at again, re-scored, and put through the email check again. <b>255</b> of the leads that landed in <code>approved_hold</code> this cycle were leads already in the book, not new finds. Some of them failed the email check the first time and passed it the second.</p>
    <p><b>The backlog fell for the first time.</b> <code>needs_contact</code> is the holding pen for creators who are good enough to contact but have no working email address. It has grown every single day since it was created. Today it took in <b>37</b> new leads and still ended <b>92</b> smaller, which means roughly <b>129</b> leads left it. The only exit is a working email address, and the only destination is <code>approved_hold</code>. That accounts for the gap between +177 parked and 48 found.</p>
    <p class="muted">One honest limit on this. The 129 is arithmetic on the two pool sizes, not a direct count, and the per-pass logs credit only a handful of it to the recovery lane specifically. The recovery lane ran seven verification passes this cycle and they were tiny, between one and ten leads each. So the pool numbers say the backlog drained; the logs cannot yet say exactly which step drained it. Worth watching for a second day before treating it as a trend.</p>
  </div>

  <div class="q accent-amber">
    <div class="ask"><span class="qn">Q2</span><span>Why did finding drop from 127 to 85?</span></div>
    <p><b>Four of the six discovery lanes now have nothing left to work on, and the fifth is nearly out.</b> This has been building for two weeks. Today is the day the arithmetic gets short.</p>
    <p>The recommended-videos lane, which is still the workhorse, found <b>67</b> of the 85. It walked <span class="pill">10,312</span> seeds to do it, and it has <b>4,670</b> left. At today's rate that is <b>about twelve hours</b> before it finishes this lap and starts another one over the same ground. Its yield is now <b>0.0065</b> good leads per seed against <b>0.45</b> on its first lap, so it is running at about one and a half percent of where it started.</p>
    <p><b>The peer-network lane has now walked every seed it owns.</b> Its book reads zero remaining. It found 4 leads from 86 seeds and refills at a trickle. Keyword search found 14, and the health check logged <b>24</b> separate observations that it had run out of search terms. The campaign loop started <b>31</b> sessions and <b>25</b> of them hit a wall and stopped within about three minutes, which is the loop correctly resting rather than grinding. The video-graph lane is still switched off on its spending cap, fifth day, with 3,390 seeds it has never walked. Podcast crossover ran once and found nothing, as usual. Comment sweep is off because you paused it.</p>
    <p class="muted">Cost is still not the problem anywhere. From the finder's own spend log: recommended videos <b>4.3¢</b> per good lead, keyword search <b>2.3¢</b>, peer network <b>3.0¢</b>. The whole day's logged discovery spend was <b>$3.41</b>.</p>
  </div>

  <div class="q accent-red">
    <div class="ask"><span class="qn">Q3</span><span>Was the machine actually working the leads it already has?</span></div>
    <p><b>For most of the night it was not, and the log said everything was fine.</b> Enrichment is the step that reads a creator's channel and builds the research file an email gets written from. A parked lead is not really ready to write until it has one.</p>
    <p>Of the <span class="pill">48</span> enrichment batches this cycle, <b>28 completed zero leads</b>. Two failures were behind it: a missing repo path setting that you fixed at about 04:30Z, and a run of enrichment crashes before that. The batches exited with a success code every time, so nothing raised an alarm. The whole cycle enriched <b>45</b> leads.</p>
    <p><b>The damage was worse than lost time.</b> The chain gives each lead three attempts and then drops it from the pool for good. During the outage it relaunched instantly on failure, so a lead could burn all three attempts in <b>ninety seconds</b> and be permanently locked out over something that had nothing to do with it. The count of permanently excluded leads ran from 67 to 105 across the outage.</p>
    <p><b>There was a guard for this and it could not see it.</b> The existing protection fires when more than 100 leads fail in one batch. The batches that failed held 2, 9, 12, 22 and 24 leads, because this machine works the new arrivals rather than a big backlog. So the guard sat there, correct and useless, through 28 dead batches in a row. Both halves are fixed today, and the 75 wrongly locked-out leads are back in the pool.</p>
  </div>

  <p class="muted">Of the 85 good leads, <b>31</b> had an email address that checked out, a verify rate of <b>36%</b> against 39% yesterday. Top categories: Real Estate <b>15</b>, Coaching and Consulting <b>12</b>, Relocation and Lifestyle Design <b>6</b>, Business Growth Coaching <b>5</b>, Transformation Coaching <b>5</b>, Health and Wellness Clinics <b>4</b>, and <b>33</b> in the catch-all. Scoring failed on zero leads. On yesterday's tarot and astrology question, today's share was <b>4 of 85</b>, or about 5%, down from 17%. That is a small enough sample and a crude enough word match that it does not settle anything either way, and nothing has been changed pending your call.</p>

  <h2>What broke → what's fixed</h2>
  <div class="tablewrap">
    <table>
      <thead><tr><th>Issue</th><th>Mechanism</th><th>Status</th></tr></thead>
      <tbody class="fix">
        <tr><td>Enrichment ran 28 dead batches and reported success each time</td><td>The mass-failure guard is written in absolute leads and only fires above 100. This machine works new arrivals, so a total outage produces batches of 2 to 24 that fail completely and stay invisible to it. Every batch exited with a success code, so the hard-wall guard never saw it either. Worse, each launched batch counts as an attempt against a three-attempt limit, so leads were permanently dropped from the pool for an outage that had nothing to do with them</td><td class="up">Fixed today (<code>53a6950</code>). Zero completed with two or more failed is now treated as infrastructure, because this pool is ordered best-first out of leads that already passed the email check, so "every one failed" is never about the leads. It refunds the attempts and backs off ten minutes per repeat up to an hour. It clears itself: one batch that completes any work resets it. Single-lead batches are exempt so a genuinely broken lead still ages out, and the refund stops after six repeats so a bad lead cannot refund itself immortal. Verified against the real failure shapes and the escalation ladder</td></tr>
        <tr><td>75 leads permanently locked out of enrichment</td><td>Collateral from the outage above</td><td class="up">Repaired. The outage batches were refunded, so the permanently-excluded count went <b>105 back to 30</b> and those leads are eligible again</td></tr>
        <tr><td>One lead has been in every single email-verification batch since 08-18</td><td>It carries a "business email" whose value is the literal words REDACTED FOR PRIVACY, scraped off a privacy-protected domain record. Nothing can ever rule on a value like that, so it never gets marked as checked, and the queue picks leads by exactly that mark. It came back forever. On a queue only 38 leads deep, one immortal entry is 3% of it</td><td class="up">Fixed today in both repos (<code>e8d0858</code>, <code>7900f17</code>). Contact points that claim to be an email now have to look like one before they are saved, tested by shape rather than a list of bad words, so the next registrar's wording fails the same test. A matching rule on the queue retires the rows already stored with no cleanup needed. Verified live: queue 38 to 37, the stuck lead gone</td></tr>
        <tr><td>Four of six discovery lanes are out of material</td><td>Peer network has walked every seed it owns. Keyword search logged 24 starvation notices. Video-graph is off on its cap. Comment sweep is paused. The recommended-videos lane has about twelve hours before it re-laps</td><td class="warn">Open, carried twelve days. No code fixes this. It is a supply decision</td></tr>
        <tr><td>The video-graph lane is off, sixth day</td><td>$50 lifetime cap. 3,390 seeds unwalked at 2.7¢ per good lead, and the only lane whose seeds are not recycled from our own past results</td><td class="warn">Open. Raising the cap is your spending call</td></tr>
      </tbody>
    </table>
  </div>
  <p class="muted">Otherwise clean: <b>0</b> fatal error signatures, <b>0</b> quota stops, <b>0</b> scoring failures, <b>0</b> hours stopped, and <b>$0.00</b> of Anthropic spend for the sixth day running. 25 finder hard walls and 5 sessions ending on their time budget, all of it the loop resting correctly against an empty term pool.</p>

  <h2>Recommended next — ranked</h2>
